name: Publish LuoJi AI Case Library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'enterprise-ai-case-library/src/**'
      - '.github/workflows/enterprise-ai-case-library-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: enterprise-ai-case-library/src
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
